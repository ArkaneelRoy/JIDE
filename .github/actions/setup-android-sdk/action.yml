name: Set up Android SDK
description: Install the Android SDK components required by AndroidIDE Ultra builds and tests

runs:
  using: composite
  steps:
    - name: Install Android SDK packages
      shell: bash
      run: |
        set -Eeuo pipefail
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        if [[ -z "${sdk_root}" ]]; then
          echo "ANDROID_SDK_ROOT or ANDROID_HOME is not set" >&2
          exit 1
        fi

        sdkmanager_bin="$(command -v sdkmanager || true)"
        if [[ -z "${sdkmanager_bin}" ]]; then
          sdkmanager_bin="$(find "${sdk_root}/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
        fi
        if [[ -z "${sdkmanager_bin}" || ! -x "${sdkmanager_bin}" ]]; then
          echo "Unable to locate sdkmanager under ${sdk_root}" >&2
          exit 1
        fi

        yes | "${sdkmanager_bin}" --sdk_root="${sdk_root}" --licenses >/dev/null || true
        "${sdkmanager_bin}" --sdk_root="${sdk_root}" \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0" \
          "ndk;26.1.10909125"
